$kind: http-request
url: "{{baseUrl}}/api/reviews"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "productId": 1,
      "note": 5,
      "commentaire": "Excellent produit"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 2000
