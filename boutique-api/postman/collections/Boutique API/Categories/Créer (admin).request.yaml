$kind: http-request
url: "{{baseUrl}}/api/categories"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: nom
      value: Vêtements
    - type: text
      key: description
      value: Mode
    - type: file
      key: image
      src: []
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 3000
