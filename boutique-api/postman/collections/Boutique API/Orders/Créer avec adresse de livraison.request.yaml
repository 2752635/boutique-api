$kind: http-request
url: "{{baseUrl}}/api/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "addressId": 1,
      "items": [
        {
          "productId": 1,
          "quantite": 2
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 2000
