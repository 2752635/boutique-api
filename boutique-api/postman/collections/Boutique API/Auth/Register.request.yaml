$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: nom
      value: Diallo
    - type: text
      key: prenom
      value: Awa
    - type: text
      key: email
      value: awa@test.com
    - type: text
      key: motDePasse
      value: secret123
    - type: file
      key: photo
      src: []
order: 1000
