$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@boutique.com",
      "motDePasse": "Admin123!"
    }
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      if (j.token) pm.collectionVariables.set('token', j.token);
    language: text/javascript
order: 2000
