$kind: http-request
url: "{{baseUrl}}/api/products"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: nom
      value: Souris
    - type: text
      key: description
      value: Souris sans fil
    - type: text
      key: prix
      value: "29.99"
    - type: text
      key: stock
      value: "50"
    - type: text
      key: categoryId
      value: "1"
    - type: file
      key: image
      src: []
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 3000
