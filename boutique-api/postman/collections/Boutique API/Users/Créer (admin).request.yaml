$kind: http-request
url: "{{baseUrl}}/api/users"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: nom
      value: Traore
    - type: text
      key: prenom
      value: Moussa
    - type: text
      key: email
      value: moussa@test.com
    - type: text
      key: motDePasse
      value: secret123
    - type: text
      key: roleId
      value: "2"
    - type: file
      key: photo
      src: []
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 3000
